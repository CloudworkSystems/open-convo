# Required check `codex-approved`: posted as a commit status on each pull
# request's head commit. Every trigger here runs the default branch's copy of
# this file, never the pull request's, and it never checks out pull request
# code. (pull_request_review is left out on purpose: it would run the pull
# request's copy of this file. Codex's reviews also update its summary
# comment, which triggers issue_comment.) See docs/plans/merge-gate.md.
name: codex-approved

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  issue_comment:
    # deleted: removing the owner's acceptance note must take effect.
    types: [created, edited, deleted]
  schedule:
    # Backstop for Codex's 👍 reactions, which send no event. Hourly: every
    # run bills a full Actions minute.
    - cron: '41 * * * *'
  workflow_dispatch:
    inputs:
      pull_request:
        description: Pull request number (blank checks every open one)
        required: false

permissions:
  contents: read
  pull-requests: read
  # write: the triage judge records its verdict as a pull request comment
  # (docs/plans/codex-triage.md). This workflow never runs pull request code.
  issues: write
  statuses: write

concurrency:
  # One group per pull request, whatever triggered the run (a manual run with
  # a number joins that pull request's group), so two runs never ask the
  # triage judge about the same pull request at once.
  group: codex-approved-${{ github.event.pull_request.number || github.event.issue.number || inputs.pull_request || 'all' }}
  cancel-in-progress: false

jobs:
  # Named differently from the `codex-approved` status on purpose: a job's
  # check run carries the job's name, and a job named `codex-approved` would
  # report "success" whenever it merely ran, next to the real status. Branch
  # protection must only ever see the status this job posts.
  evaluate-codex:
    name: evaluate-codex
    # Only comments by Codex or the owner (his owner-accepts-findings note)
    # can change the result, so other comments are skipped (skipped jobs
    # bill no minutes). An edit by anyone to such a comment still runs it.
    if: >-
      github.event_name != 'issue_comment' ||
      (github.event.issue.pull_request && (github.event.comment.user.login == 'chatgpt-codex-connector[bot]' || github.event.comment.user.login == 'CloudworkSystems'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: .github/scripts
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node .github/scripts/codex-approved.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The triage judge's key. Unset: the judge is never asked.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
