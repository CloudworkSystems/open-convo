# Publishes the public website (site/ plus the Ember brand files it uses) to
# GitHub Pages when main changes. Runs only main's own files, never a pull
# request's. The custom domain (trueconvo.com) is set in the repo's Pages
# settings, not here.
name: pages

on:
  push:
    branches: [main]
    paths: ['site/**', 'brand/tokens.css', 'brand/fonts/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    # A manual run can pick any branch; only main may publish.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Stage the site
        run: |
          mkdir -p _site/brand
          cp -R site/. _site/
          # Agent rules files live beside the site but are not part of it.
          rm -f _site/AGENTS.md _site/CLAUDE.md
          cp brand/tokens.css _site/brand/
          cp -R brand/fonts _site/brand/fonts
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
