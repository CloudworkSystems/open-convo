# Rebuilds the PR history spreadsheet once a day (owner's choice, October 29)
# and keeps it on its own branch, pr-history-data, never on main. The owner's
# Google Sheet reads pr-history.csv there with IMPORTDATA. Runs only the
# default branch's script on a schedule or by hand, never pull request code.
name: pr-history

on:
  schedule:
    # 6:17 AM Eastern (10:17 UTC in daylight time), before the 7:52 list.
    - cron: '17 10 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read
  issues: read

concurrency:
  group: pr-history
  cancel-in-progress: false

jobs:
  pr-history:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check out the data branch
        run: |
          if git ls-remote --exit-code --heads origin pr-history-data; then
            git fetch --depth=1 origin pr-history-data
            git worktree add data FETCH_HEAD
            git -C data switch -c pr-history-data
          else
            git worktree add --orphan -b pr-history-data data
          fi
      - run: node .github/scripts/pr-history.mjs data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Save the new rows
        working-directory: data
        run: |
          git add README.md pr-history.csv pr-history.json
          if git diff --cached --quiet -- pr-history.csv; then
            echo "No pull request changed."
            exit 0
          fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m "PR history $(date -u +%Y-%m-%d)"
          git push origin pr-history-data
