# Deploys the front porch API to Cloudflare Workers (docs/plans/front-porch-api.md).
# Runs only main's own files, never a pull request's. Every run waits for the
# owner's approval: the job runs in the front-porch-production environment,
# whose required reviewer is the owner, and the Cloudflare token is a secret of
# that environment only. The job also refuses to deploy if that reviewer rule
# is missing.
#
# The deploy uploads the Worker and its own settings. It never adds, changes
# or removes routes or custom domains; the owner attaches api.trueconvo.com in
# the Cloudflare dashboard. Every ordinary deploy uses the production settings
# in wrangler.toml (workers.dev off), which leave that custom domain alone.
#
# A manual run with staging_url deploys the staging settings instead (the same
# Worker with its workers.dev address on), scans that address with OWASP ZAP,
# and then, in the same approved run and whatever the scan found, deploys the
# production settings again so the workers.dev address is off before the
# owner attaches the custom domain. It is the one staging step before
# api.trueconvo.com is attached, so it runs only while that name doesn't
# exist in DNS; any other answer, including a timeout or an error, refuses it.
name: front-porch-deploy

on:
  push:
    branches: [main]
    paths: ['services/front-porch/**', '.github/workflows/front-porch-deploy.yml']
  workflow_dispatch:
    inputs:
      staging_url:
        description: "Staging only, before api.trueconvo.com is attached: the Worker's workers.dev address to deploy to and ZAP-scan, such as https://front-porch.example.workers.dev"
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: front-porch-deploy
  cancel-in-progress: false

jobs:
  deploy:
    # A manual run can pick any branch; only main may deploy.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: front-porch-production
    permissions:
      contents: read
      actions: read
    steps:
      # Reading an environment's settings needs the Actions read permission
      # (given to this job above); as the repo is public, an unsigned read is
      # tried if the token's is refused. If both fail, nothing is deployed.
      - name: Check that the owner still approves every deploy
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          url="https://api.github.com/repos/$REPO/environments/front-porch-production"
          rules=$(curl -fsS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "$url" \
            || curl -fsS -H "Accept: application/vnd.github+json" "$url")
          echo "$rules" | node -e '
            const env = JSON.parse(require("fs").readFileSync(0, "utf8"));
            const reviewers = (env.protection_rules || []).filter((r) => r.type === "required_reviewers");
            const owner = reviewers.flatMap((r) => r.reviewers || []).some((r) => r.type === "User" && r.reviewer && r.reviewer.login === "CloudworkSystems");
            if (!owner) { console.error("front-porch-production has no required reviewer rule naming the owner, so nothing is deployed."); process.exit(1); }
            console.log("The owner is the required reviewer of front-porch-production.");'
      - name: Check that the Cloudflare setup is in place
        env:
          HAS_TOKEN: ${{ secrets.FRONT_PORCH_CLOUDFLARE_TOKEN != '' }}
          HAS_ACCOUNT: ${{ vars.FRONT_PORCH_CLOUDFLARE_ACCOUNT_ID != '' }}
        run: |
          if [ "$HAS_TOKEN" != true ] || [ "$HAS_ACCOUNT" != true ]; then
            echo "The front-porch-production environment needs the FRONT_PORCH_CLOUDFLARE_TOKEN secret and the FRONT_PORCH_CLOUDFLARE_ACCOUNT_ID variable first. Nothing was deployed."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: services/front-porch
      - run: npm test
        working-directory: services/front-porch
      # A staging deploy turns the workers.dev address on, outside the zone's
      # rate limit, so it runs only before the custom domain exists. curl exit
      # code 6 means the name doesn't resolve; anything else (an answer, a
      # timeout, an error page) refuses the run.
      - name: Refuse a staging deploy unless api.trueconvo.com is not set up yet
        if: github.event_name == 'workflow_dispatch' && inputs.staging_url != ''
        run: |
          set +e
          curl -sS -m 15 -o /dev/null https://api.trueconvo.com/v1/status
          code=$?
          set -e
          if [ "$code" -ne 6 ]; then
            echo "api.trueconvo.com exists or couldn't be checked (curl exit $code), so the staging deploy is refused. Run without staging_url."
            exit 1
          fi
      - name: Deploy the Worker
        if: github.event_name != 'workflow_dispatch' || inputs.staging_url == ''
        working-directory: services/front-porch
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.FRONT_PORCH_CLOUDFLARE_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.FRONT_PORCH_CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: 'false'
        run: npx wrangler deploy
      - name: Deploy the staging settings
        id: staging
        if: github.event_name == 'workflow_dispatch' && inputs.staging_url != ''
        working-directory: services/front-porch
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.FRONT_PORCH_CLOUDFLARE_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.FRONT_PORCH_CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: 'false'
        run: npx wrangler deploy --env staging
      # The scan step never sees the token. The scan script refuses any
      # address but the Worker's workers.dev one.
      - name: Scan the staging address with OWASP ZAP
        if: steps.staging.outcome == 'success'
        timeout-minutes: 25
        working-directory: services/front-porch
        env:
          STAGING_URL: ${{ inputs.staging_url }}
        run: node scan/zap-scan.mjs "$STAGING_URL"
      # Runs whenever the staging deploy was started, even if it or the scan
      # failed or the run was cancelled (always() steps still run after a
      # cancel), so the workers.dev address never stays on after this run.
      - name: Turn the workers.dev address off again
        if: always() && steps.staging.outcome != '' && steps.staging.outcome != 'skipped'
        working-directory: services/front-porch
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.FRONT_PORCH_CLOUDFLARE_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.FRONT_PORCH_CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: 'false'
        run: npx wrangler deploy
      - if: always() && steps.staging.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: front-porch-staging-zap-report
          path: services/front-porch/scan/out/report.*
          if-no-files-found: ignore
