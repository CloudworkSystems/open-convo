# Required check `tests`: runs the tests of every part a pull request changes.
# Runs the pull request's code, so its token is read-only and holds no secrets.
name: tests

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      clarity: ${{ steps.diff.outputs.clarity }}
      desk: ${{ steps.diff.outputs.desk }}
      mac: ${{ steps.diff.outputs.mac }}
      gate: ${{ steps.diff.outputs.gate }}
      # JSON list of the other packages/* folders to test (see the packages job).
      packages: ${{ steps.diff.outputs.packages }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ -z "$BASE" ]; then
            # Manual run: test everything.
            for part in clarity desk mac gate; do echo "$part=true" >> "$GITHUB_OUTPUT"; done
            packages=$(node .github/scripts/package-changes.mjs --all)
            echo "packages=$packages" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files=$(git diff --name-only "$(git merge-base "$BASE" "$HEAD")" "$HEAD")
          echo "$files"
          has() { echo "$files" | grep -Eq "$1" && echo true || echo false; }
          # A change to the checks themselves runs every part.
          all=$(has '^\.github/')
          echo "clarity=$([ "$all" = true ] && echo true || has '^packages/clarity/')" >> "$GITHUB_OUTPUT"
          echo "desk=$([ "$all" = true ] && echo true || has '^(apps/desk/|packages/clarity/)')" >> "$GITHUB_OUTPUT"
          # The Mac tests also read the Desk's shared fixtures.
          echo "mac=$([ "$all" = true ] && echo true || has '^(apps/mac/|apps/desk/tests/fixtures/)')" >> "$GITHUB_OUTPUT"
          echo "gate=$all" >> "$GITHUB_OUTPUT"
          # Every other package with a package.json, found by folder, so new
          # packages are covered without editing this file.
          packages=$(echo "$files" | node .github/scripts/package-changes.mjs)
          echo "Packages to test: $packages"
          echo "packages=$packages" >> "$GITHUB_OUTPUT"

  clarity:
    needs: changes
    if: needs.changes.outputs.clarity == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm test
        working-directory: packages/clarity

  desk:
    needs: changes
    if: needs.changes.outputs.desk == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desk/package-lock.json
      - run: npm ci
        working-directory: apps/desk
      # Build (with typecheck) and the unit tests. The browser suite
      # (test:browser, test:native-proof) still runs on the Mac only: its
      # setup fails on GitHub's Linux machines and then hangs.
      - run: npm run build
        working-directory: apps/desk
      - run: npm test
        working-directory: apps/desk

  mac:
    needs: changes
    if: needs.changes.outputs.mac == 'true'
    # macOS minutes count ten times against the monthly allowance, so this
    # runs only when apps/mac (or the checks) change.
    # macOS 26 to match the Swift the owner's Mac builds with.
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: xcodebuild -version && swift --version
      - run: swift test
        working-directory: apps/mac
      # Packaging checks (stand-ins only: never builds, signs or installs).
      # The byte-identity comparison needs a True Convo commit this repo
      # doesn't have, so it is skipped here until the baseline is brought over.
      - run: bash scripts/tests/package_app_desk_output_test.sh
        working-directory: apps/mac
        env:
          ALLOW_MISSING_BASELINE: '1'

  # The Mac test suites load bundled copies of the Desk's contract fixtures.
  # The copies must stay byte-identical to the Desk's originals (cheap, Linux).
  fixtures:
    needs: changes
    if: needs.changes.outputs.desk == 'true' || needs.changes.outputs.mac == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: |
          status=0
          check() { if cmp -s "$1" "$2"; then echo "same: $2"; else echo "DIFFERENT: $2 must be an exact copy of $1"; status=1; fi; }
          check apps/desk/tests/fixtures/native-host-v1.json apps/mac/Tests/DeskHostTests/Fixtures/native-host-v1.json
          check apps/desk/tests/fixtures/native-host-v1.json apps/mac/Tests/DeskHostWebKitTests/Fixtures/native-host-v1.json
          check apps/desk/tests/fixtures/native-participant-v1.json apps/mac/Tests/ParticipantProcessTests/Fixtures/native-participant-v1.json
          check apps/desk/tests/fixtures/native-participant-local-v1.json apps/mac/Tests/ParticipantProcessTests/Fixtures/native-participant-local-v1.json
          exit $status

  gate:
    needs: changes
    if: needs.changes.outputs.gate == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node --test .github/scripts/tests/*.test.mjs

  # One run per changed package in packages/ that has no job of its own above
  # (site-engine, household-lists, and new ones such as habit-grid).
  packages:
    needs: changes
    if: needs.changes.outputs.packages != '[]'
    name: package (${{ matrix.package }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.changes.outputs.packages) }}
    defaults:
      run:
        working-directory: packages/${{ matrix.package }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # npm ci needs a lockfile. A package with no dependencies has nothing to
      # install; one with dependencies but no lockfile fails.
      - name: npm ci
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          elif node -e "const p = require('./package.json'); process.exit(Object.keys({ ...p.dependencies, ...p.devDependencies, ...p.optionalDependencies }).length ? 0 : 1)"; then
            echo "This package has dependencies but no package-lock.json, so npm ci can't install them."
            exit 1
          else
            echo "No dependencies to install."
          fi
      - run: npm test

  # The one check branch protection requires. Passes only if every part that
  # ran passed; parts with no changes are skipped.
  tests:
    needs: [changes, clarity, desk, mac, fixtures, gate, packages]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Results: $RESULTS"
          for result in $RESULTS; do
            case "$result" in success|skipped) ;; *) echo "A test job did not pass."; exit 1 ;; esac
          done
