<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900">
  <defs>
    <linearGradient id="ember" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#C8298B"/>
      <stop offset="62%" stop-color="#F37A4A"/>
      <stop offset="100%" stop-color="#F7B267"/>
    </linearGradient>
    <linearGradient id="softEmber" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="rgba(200,41,139,0.18)"/>
      <stop offset="100%" stop-color="rgba(243,122,74,0.14)"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="28" flood-color="#1E0A14" flood-opacity="0.55"/>
    </filter>
    <style>
      .bg { fill: #15110F; }
      .title { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 44px; font-weight: 760; fill: #F7F2EE; letter-spacing: -1px; }
      .subtitle { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 20px; fill: #CEC3BC; }
      .label { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 20px; font-weight: 700; fill: #F7F2EE; }
      .note { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 15px; fill: #908179; }
      .mono { font-family: "JetBrains Mono", "SFMono-Regular", ui-monospace, monospace; font-size: 13px; fill: #908179; letter-spacing: 1px; text-transform: uppercase; }
      .panel-title { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 22px; font-weight: 720; fill: #F7F2EE; }
      .panel-copy { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 16px; fill: #CEC3BC; }
      .chip-text { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 14px; font-weight: 700; fill: #15110F; }
    </style>
  </defs>

  <rect class="bg" width="1400" height="900"/>
  <circle cx="1110" cy="170" r="270" fill="url(#ember)" opacity="0.18"/>
  <circle cx="240" cy="780" r="320" fill="#C8298B" opacity="0.08"/>

  <text x="72" y="88" class="mono">True Convo AI / TCA / TCAS</text>
  <text x="72" y="144" class="title">Canonical Ember Palette</text>
  <text x="72" y="184" class="subtitle">Confirmed brand palette for TCA / TCAS on 2026-06-08.</text>

  <g transform="translate(72 240)" filter="url(#shadow)">
    <rect width="590" height="210" rx="18" fill="#1B1614" stroke="rgba(247,242,238,0.12)"/>
    <rect x="28" y="32" width="534" height="84" rx="16" fill="url(#ember)"/>
    <text x="28" y="156" class="panel-title">Primary Ember Gradient</text>
    <text x="28" y="184" class="panel-copy">Use for major actions, active identity, highlights, and tasteful glow.</text>
  </g>

  <g transform="translate(700 240)" filter="url(#shadow)">
    <rect width="628" height="210" rx="18" fill="#221C1A" stroke="rgba(247,242,238,0.12)"/>
    <circle cx="70" cy="72" r="38" fill="#C8298B"/>
    <circle cx="170" cy="72" r="38" fill="#F37A4A"/>
    <circle cx="270" cy="72" r="38" fill="#F7B267"/>
    <text x="330" y="66" class="panel-title">Accent Stops</text>
    <text x="330" y="96" class="panel-copy">Magenta, coral, amber. More ember than neon.</text>
    <text x="330" y="138" class="note">This is the visual direction you described.</text>
  </g>

  <g transform="translate(72 500)">
    <text x="0" y="0" class="mono">Dark shell neutrals</text>
    <g transform="translate(0 28)">
      <rect width="190" height="150" rx="14" fill="#15110F" stroke="rgba(247,242,238,0.18)"/>
      <text x="18" y="102" class="label">Ink</text>
      <text x="18" y="128" class="note">page base</text>
    </g>
    <g transform="translate(210 28)">
      <rect width="190" height="150" rx="14" fill="#1B1614" stroke="rgba(247,242,238,0.18)"/>
      <text x="18" y="102" class="label">Surface 0</text>
      <text x="18" y="128" class="note">raised shell</text>
    </g>
    <g transform="translate(420 28)">
      <rect width="190" height="150" rx="14" fill="#221C1A" stroke="rgba(247,242,238,0.18)"/>
      <text x="18" y="102" class="label">Surface 1</text>
      <text x="18" y="128" class="note">cards / bays</text>
    </g>
    <g transform="translate(630 28)">
      <rect width="190" height="150" rx="14" fill="#2B2320" stroke="rgba(247,242,238,0.18)"/>
      <text x="18" y="102" class="label">Surface 2</text>
      <text x="18" y="128" class="note">hover / active</text>
    </g>
  </g>

  <g transform="translate(72 725)">
    <text x="0" y="0" class="mono">Text and signals</text>
    <g transform="translate(0 30)">
      <rect width="180" height="86" rx="12" fill="#F7F2EE"/>
      <text x="18" y="52" class="chip-text">Primary text</text>
    </g>
    <g transform="translate(196 30)">
      <rect width="180" height="86" rx="12" fill="#CEC3BC"/>
      <text x="18" y="52" class="chip-text">Body text</text>
    </g>
    <g transform="translate(392 30)">
      <rect width="180" height="86" rx="12" fill="#908179"/>
      <text x="18" y="52" class="chip-text">Muted text</text>
    </g>
    <g transform="translate(628 30)">
      <rect width="132" height="86" rx="12" fill="#5FAE8A"/>
      <text x="18" y="52" class="chip-text">Success</text>
    </g>
    <g transform="translate(776 30)">
      <rect width="132" height="86" rx="12" fill="#D49A3F"/>
      <text x="18" y="52" class="chip-text">Warn</text>
    </g>
    <g transform="translate(924 30)">
      <rect width="132" height="86" rx="12" fill="#D26A6A"/>
      <text x="18" y="52" class="chip-text">Danger</text>
    </g>
    <g transform="translate(1072 30)">
      <rect width="132" height="86" rx="12" fill="#6A9ECF"/>
      <text x="18" y="52" class="chip-text">Info</text>
    </g>
  </g>

  <g transform="translate(1110 604)">
    <rect width="218" height="76" rx="14" fill="none" stroke="url(#ember)" stroke-width="2"/>
    <text x="22" y="34" class="label">Not the</text>
    <text x="22" y="58" class="label">green palette.</text>
  </g>
</svg>
